# Approve + apply after merge to main. A merge NEVER applies directly:
#   1. guard   - fails unless environment 'poc-apply' exists WITH required reviewers
#   2. changes - which request files changed (all of them if modules/, stacks/ or config/ changed)
#   3. plan    - read-only identity, one saved plan per request, shown in the run summary
#   4. apply   - waits for a reviewer to approve 'poc-apply' (one approval covers every
#                request in the run), then applies EXACTLY the saved plans
name: vending-apply

on:
  push:
    branches: [main]
    paths:
      - "subscriptions/**"
      - "config/**"
      - "modules/**"
      - "stacks/**"
  workflow_dispatch:
    inputs:
      all:
        description: "Plan and apply every request, not only changed ones"
        type: boolean
        default: false

concurrency:
  group: vending-apply      # one run at a time; later merges queue behind
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_billing_scope: ${{ vars.BILLING_SCOPE }}

jobs:
  guard:
    name: guard (approval gate configured)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require reviewers on environment poc-apply
        uses: actions/github-script@v7
        with:
          script: |
            let env;
            try {
              ({ data: env } = await github.rest.repos.getEnvironment({ ...context.repo, environment_name: 'poc-apply' }));
            } catch (e) {
              core.setFailed("Environment 'poc-apply' does not exist. Create it with a required reviewer before applying.");
              return;
            }
            const reviewers = (env.protection_rules || []).find(r => r.type === 'required_reviewers');
            if (!reviewers || !(reviewers.reviewers || []).length) {
              core.setFailed("Environment 'poc-apply' has no required reviewers. Add one; apply will not run unattended.");
              return;
            }
            core.info(`poc-apply reviewers: ${reviewers.reviewers.map(r => r.reviewer.login || r.reviewer.name).join(', ')}`);

  changes:
    name: changed requests
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files: ${{ steps.changes.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Requests to apply
        id: changes
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$ALL" = "true" ]; then
            files=$(bash ci/changed-requests.sh all)
          else
            files=$(bash ci/changed-requests.sh "${BASE:-0000000000000000000000000000000000000000}" "$HEAD")
          fi
          echo "Requests: $files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  plan:
    name: plan ${{ matrix.file }}
    needs: changes
    if: needs.changes.outputs.files != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.changes.outputs.files) }}
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_PLAN }}   # read-only identity (OIDC subject: ref:refs/heads/main)
    defaults:
      run:
        working-directory: stacks/subscription
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-init
        with:
          request-file: ${{ matrix.file }}

      - name: terraform plan
        id: plan
        run: |
          mkdir -p out
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode -var="request_file=$REQUEST_PATH" -out=out/tfplan
          code=$?
          set -e
          case $code in
            0) echo "false" > out/has-changes ;;
            2) echo "true"  > out/has-changes ;;
            *) echo "::error::terraform plan failed"; exit 1 ;;
          esac

      - name: Plan gate (no deletes)
        env:
          REQUEST_FILE: ${{ matrix.file }}
        run: |
          terraform show -json out/tfplan > plan.json
          sh ../../ci/plan-gate.sh plan.json

      - name: Plan summary (review this before approving)
        env:
          REQUEST_FILE: ${{ matrix.file }}
        run: |
          {
            echo "## \`$REQUEST_FILE\`"
            if [ "$(cat out/has-changes)" = "true" ]; then
              echo '```'
              terraform show -no-color out/tfplan | tail -c 60000
              echo '```'
            else
              echo "No changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: stacks/subscription/out/
          retention-days: 1

  apply:
    name: apply ${{ matrix.file }}
    needs: [changes, plan]
    runs-on: ubuntu-latest
    environment: poc-apply   # pauses here until a required reviewer approves
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.changes.outputs.files) }}
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_APPLY }}  # apply identity (OIDC subject: environment:poc-apply)
    defaults:
      run:
        working-directory: stacks/subscription
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-init
        with:
          request-file: ${{ matrix.file }}

      - name: Download approved plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: stacks/subscription/out

      - name: terraform apply (saved plan only)
        run: |
          if [ "$(cat out/has-changes)" = "true" ]; then
            terraform apply -input=false -lock-timeout=5m out/tfplan
          else
            echo "No changes - nothing to apply."
          fi

      - name: Outputs
        env:
          REQUEST_FILE: ${{ matrix.file }}
        run: |
          {
            echo "## \`$REQUEST_FILE\`"
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
