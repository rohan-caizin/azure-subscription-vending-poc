# Proposal §5: Approve + Apply after merge to main.
#
# A merge NEVER applies directly:
#   1. guard  - fails unless environment 'poc-apply' exists WITH required reviewers
#               (otherwise GitHub would auto-create it unprotected and apply would run unattended)
#   2. plan   - read-only identity; saves the plan and shows it in the run summary
#   3. apply  - waits for a reviewer to approve 'poc-apply', then applies EXACTLY the saved plan
#               (skipped when the plan has no changes)
name: vending-apply

on:
  push:
    branches: [main]
    paths:
      - "vending/**"
  workflow_dispatch: {}

concurrency:
  group: vending-apply      # one plan/apply at a time; later merges queue behind
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_hub_vnet_id: ${{ vars.HUB_VNET_ID }}

jobs:
  guard:
    name: guard (approval gate configured)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require reviewers on environment poc-apply
        uses: actions/github-script@v7
        with:
          script: |
            let env;
            try {
              ({ data: env } = await github.rest.repos.getEnvironment({ ...context.repo, environment_name: 'poc-apply' }));
            } catch (e) {
              core.setFailed("Environment 'poc-apply' does not exist. Create it with a required reviewer before applying.");
              return;
            }
            const reviewers = (env.protection_rules || []).find(r => r.type === 'required_reviewers');
            if (!reviewers || !(reviewers.reviewers || []).length) {
              core.setFailed("Environment 'poc-apply' has no required reviewers. Add one; apply will not run unattended.");
              return;
            }
            core.info(`poc-apply reviewers: ${reviewers.reviewers.map(r => r.reviewer.login || r.reviewer.name).join(', ')}`);

  plan:
    name: plan
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_PLAN }}   # read-only identity (OIDC subject: ref:refs/heads/main)
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: vending
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate request files
        run: |
          pip install --quiet pyyaml jsonschema
          python ../scripts/validate_requests.py landing-zones ../schema/landing-zone.schema.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          case $code in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::terraform plan failed"; exit 1 ;;
          esac

      - name: Destroy guard
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          terraform show -json tfplan > plan.json
          DELETES=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' plan.json)
          if [ "$DELETES" -gt 0 ]; then
            echo "::error::Plan deletes or replaces $DELETES resource(s). Blocked by the destroy guard."
            jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "  \(.change.actions | join("/"))  \(.address)"' plan.json
            exit 1
          fi

      - name: Plan summary (review this before approving)
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          {
            echo "## Plan to be applied after approval"
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No changes
        if: steps.plan.outputs.has_changes == 'false'
        run: echo "## No changes - nothing to apply" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: vending/tfplan
          retention-days: 1

  apply:
    name: apply (requires approval)
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: poc-apply   # pauses here until a required reviewer approves
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_APPLY }}  # apply identity (OIDC subject: environment:poc-apply)
    defaults:
      run:
        working-directory: vending
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download approved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: vending

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply (saved plan only)
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Outputs
        run: |
          echo "## Landing zones" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          terraform output -json landing_zones >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
