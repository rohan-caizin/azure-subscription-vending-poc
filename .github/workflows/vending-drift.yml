# Nightly drift detection for every request. Any change made outside Terraform fails
# that request's job and opens an issue.
name: vending-drift

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_PLAN }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_billing_scope: ${{ vars.BILLING_SCOPE }}

jobs:
  requests:
    name: list requests
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.all.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: all
        run: echo "files=$(bash ci/changed-requests.sh all)" >> "$GITHUB_OUTPUT"

  drift:
    name: drift ${{ matrix.file }}
    needs: requests
    if: needs.requests.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.requests.outputs.files) }}
    defaults:
      run:
        working-directory: stacks/subscription
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-init
        with:
          request-file: ${{ matrix.file }}

      - name: Detect drift
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -no-color -var="request_file=$REQUEST_PATH" > drift.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          tail -n 40 drift.txt
          case $code in
            0) echo "No drift." ;;
            2) echo "::warning::Drift detected." ;;
            *) echo "::error::terraform plan failed."; exit 1 ;;
          esac

      - name: Open issue on drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          REQUEST_FILE: ${{ matrix.file }}
        with:
          script: |
            const fs = require('fs');
            let out = fs.readFileSync('stacks/subscription/drift.txt', 'utf8');
            if (out.length > 60000) out = out.slice(-60000);
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              ...context.repo,
              title: `Drift detected in ${process.env.REQUEST_FILE} (${date})`,
              body: `Resources were changed outside Terraform.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`\n${out}\n\`\`\``
            });
            core.setFailed('Drift detected');
