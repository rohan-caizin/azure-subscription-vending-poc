# Validate + plan on every pull request (read-only identity).
# One plan per changed request file, each against its own state.
name: vending-pr

on:
  pull_request:
    branches: [main]
    paths:
      - "subscriptions/**"
      - "config/**"
      - "modules/**"
      - "stacks/**"
      - "ci/**"
      - ".github/actions/**"
      - ".github/workflows/vending-*.yml"

permissions:
  id-token: write       # OIDC token for Azure
  contents: read
  pull-requests: write  # post plans as PR comments

concurrency:
  group: vending-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_billing_scope: ${{ vars.BILLING_SCOPE }}

jobs:
  validate:
    name: validate + test
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changes.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cross-request checks (names, CIDR overlaps, layout)
        run: |
          pip install --quiet pyyaml
          python ci/validate_requests.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform test (mocked providers, no Azure)
        run: |
          (cd modules/landing-zone && terraform init -backend=false -input=false && terraform test)
          (cd stacks/subscription && terraform init -backend=false -input=false && terraform test)

      - name: Requests to plan
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(bash ci/changed-requests.sh "$BASE" "$HEAD")
          echo "Requests: $files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  plan:
    name: plan ${{ matrix.file }}
    needs: validate
    if: needs.validate.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.validate.outputs.files) }}
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_PLAN }}
    defaults:
      run:
        working-directory: stacks/subscription
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-init
        with:
          request-file: ${{ matrix.file }}

      - name: terraform plan
        run: |
          terraform plan -input=false -lock-timeout=5m -var="request_file=$REQUEST_PATH" -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Plan gate (no deletes)
        env:
          REQUEST_FILE: ${{ matrix.file }}
        run: sh ../../ci/plan-gate.sh plan.json

      - name: Post plan to PR
        if: always() && hashFiles('stacks/subscription/plan.txt') != ''
        uses: actions/github-script@v7
        env:
          REQUEST_FILE: ${{ matrix.file }}
        with:
          script: |
            const fs = require('fs');
            const file = process.env.REQUEST_FILE;
            const marker = `<!-- vending-plan:${file} -->`;
            let plan = fs.readFileSync('stacks/subscription/plan.txt', 'utf8');
            const summary = (plan.match(/^Plan: .*$/m) || plan.match(/^No changes\..*$/m) || ['(see details)'])[0];
            if (plan.length > 60000) plan = plan.slice(-60000) + '\n... (truncated, see job log)';
            const body = `${marker}\n### Terraform plan: \`${file}\`\n**${summary}**\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
