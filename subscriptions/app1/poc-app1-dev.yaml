# Landing zone inside the shared platform subscription ("adopt" mode).
# The file path is permanent: it is the Terraform state key. Group files by team, not archetype.
name: poc-app1-dev
archetype: corp

# Adopt this existing subscription instead of creating one. It is the platform
# subscription, so access is limited to rg-poc-app1-dev-* only.
